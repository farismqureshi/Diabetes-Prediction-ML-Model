# Recreate the environment with:
#   conda env create -f environment.yml
#   conda activate brfss-diabetes
name: brfss-diabetes
channels:
  - conda-forge
dependencies:
  - python=3.14
  - numpy=2.5.1
  - pandas=3.0.3
  - scipy=1.18.0
  - scikit-learn=1.9.0
  - matplotlib=3.11.1
  - seaborn=0.13.2
  - joblib=1.5.3
  - ipykernel=7.3.0
  - pip
  - pip:
      - lightgbm==4.7.0
      - kagglehub
